name: Finalize native dark surfaces

on:
  push:
    branches:
      - fix/015-safe-launcher
    paths:
      - .github/workflows/native-theme-finalize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/015-safe-launcher
          fetch-depth: 0
          persist-credentials: true
      - name: Finalize remaining native dark surfaces
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/native-theme-finalize.py
          python3 /tmp/native-theme-finalize.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "PocketSpace"
          git config user.email "xbu080675@gmail.com"
          git add app
          git commit -m "fix: finish dark semantic surfaces"
          git push origin HEAD:fix/015-safe-launcher
