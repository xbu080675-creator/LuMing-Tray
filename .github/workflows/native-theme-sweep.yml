name: One-shot native dark theme sweep

on:
  push:
    branches:
      - fix/015-safe-launcher
    paths:
      - .github/workflows/native-theme-sweep.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/015-safe-launcher
          fetch-depth: 0
          persist-credentials: true

      - name: Patch native theme coverage and unsupported TOTP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/luming/tray')

          def read(name):
              return (root / name).read_text()

          def write(name, text):
              (root / name).write_text(text)

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          # Central activity-level Material theme. This is intentionally tiny and runs before
          # Activity.onCreate so platform dialogs/spinners follow LuMing's own theme preference.
          name = 'LuMingApp.kt'
          s = read(name)
          marker = '    fun applySystemBars(activity: Activity) {'
          if 'fun applyActivityTheme(activity: Activity)' not in s:
              s = s.replace(marker, '''    fun applyActivityTheme(activity: Activity) {
        activity.setTheme(
            if (isDark(activity)) android.R.style.Theme_Material_NoActionBar
            else android.R.style.Theme_Material_Light_NoActionBar
        )
    }

''' + marker, 1)
          write(name, s)

          # Page onCreate hooks: apply native Material theme before super, then conservative bars.
          replacements = {
              'AccountActivity.kt': ('''    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
        setContentView(buildUi())
        loadData()
    }''', '''    override fun onCreate(savedInstanceState: Bundle?) {
        LuMingTheme.applyActivityTheme(this)
        super.onCreate(savedInstanceState)
        LuMingTheme.applySystemBars(this)
        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
        setContentView(buildUi())
        loadData()
    }'''),
              'AnalysisActivity.kt': ('''    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.statusBarColor = bgColor()
        window.navigationBarColor = bgColor()
        @Suppress("DEPRECATION")
        window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
        setContentView(buildUi())
        loadReport()
    }''', '''    override fun onCreate(savedInstanceState: Bundle?) {
        LuMingTheme.applyActivityTheme(this)
        super.onCreate(savedInstanceState)
        LuMingTheme.applySystemBars(this)
        setContentView(buildUi())
        loadReport()
    }'''),
              'UsageExplorerActivity.kt': ('''    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.statusBarColor = bgColor()
        window.navigationBarColor = bgColor()
        @Suppress("DEPRECATION")
        window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
        setContentView(buildUi())
        loadData(currentFilter)
    }''', '''    override fun onCreate(savedInstanceState: Bundle?) {
        LuMingTheme.applyActivityTheme(this)
        super.onCreate(savedInstanceState)
        LuMingTheme.applySystemBars(this)
        setContentView(buildUi())
        loadData(currentFilter)
    }'''),
              'ApiKeyManagementActivity.kt': ('''    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.statusBarColor = bgColor()
        window.navigationBarColor = bgColor()
        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
        @Suppress("DEPRECATION")
        window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
        setContentView(buildUi())
        loadData()
    }''', '''    override fun onCreate(savedInstanceState: Bundle?) {
        LuMingTheme.applyActivityTheme(this)
        super.onCreate(savedInstanceState)
        LuMingTheme.applySystemBars(this)
        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
        setContentView(buildUi())
        loadData()
    }''')
          }
          for file, (old, new) in replacements.items():
              s = read(file)
              s = must_replace(s, old, new, file + ' onCreate')
              write(file, s)

          # Replace legacy hard-coded palette helper functions with the central palette.
          helper_map = {
              'bgColor': 'LuMingTheme.bg(this)',
              'panelColor': 'LuMingTheme.panel(this)',
              'accentColor': 'LuMingTheme.accent(this)',
              'accentDark': 'LuMingTheme.accentDark(this)',
              'textPrimary': 'LuMingTheme.textPrimary(this)',
              'textSecondary': 'LuMingTheme.textSecondary(this)',
              'textMuted': 'LuMingTheme.textMuted(this)',
          }
          classes = {
              'AccountActivity.kt': 'AccountActivity',
              'AnalysisActivity.kt': 'AnalysisActivity',
              'UsageExplorerActivity.kt': 'UsageExplorerActivity',
              'ApiKeyManagementActivity.kt': 'ApiKeyManagementActivity',
          }
          for file, cls in classes.items():
              s = read(file)
              for fn, expr in helper_map.items():
                  s = re.sub(rf'private fun {fn}\(\) = Color\.rgb\([^\n]+\)', f'private fun {fn}() = {expr}', s)
              s = s.replace('Color.argb(210, 255, 255, 255)', f'LuMingTheme.border(this@{cls})')
              write(file, s)

          # Account center: inputs/buttons/pills also follow palette; unsupported TOTP becomes honest UI.
          name = 'AccountActivity.kt'
          s = read(name)
          s = s.replace('setHintTextColor(Color.rgb(145, 154, 164))', 'setHintTextColor(LuMingTheme.hint(this@AccountActivity))')
          s = s.replace('background = pillBackground(Color.rgb(222, 243, 237))', 'background = pillBackground(LuMingTheme.positivePill(this@AccountActivity))')
          s = s.replace('''private fun buttonBackground(active: Boolean) = GradientDrawable().apply { setColor(if (active) Color.rgb(225, 244, 239) else Color.rgb(239, 244, 246)); cornerRadius = dp(17).toFloat(); setStroke(dp(1), if (active) Color.rgb(199, 231, 222) else Color.rgb(221, 229, 233)) }''', '''private fun buttonBackground(active: Boolean) = GradientDrawable().apply { setColor(if (active) LuMingTheme.activeBg(this@AccountActivity) else LuMingTheme.panelAlt(this@AccountActivity)); cornerRadius = dp(17).toFloat(); setStroke(dp(1), if (active) LuMingTheme.activeBorder(this@AccountActivity) else LuMingTheme.border(this@AccountActivity)) }''')
          s = s.replace('''private fun inputBackground() = GradientDrawable().apply { setColor(Color.rgb(235, 241, 244)); cornerRadius = dp(17).toFloat(); setStroke(dp(1), Color.rgb(218, 227, 231)) }''', '''private fun inputBackground() = GradientDrawable().apply { setColor(LuMingTheme.input(this@AccountActivity)); cornerRadius = dp(17).toFloat(); setStroke(dp(1), LuMingTheme.border(this@AccountActivity)) }''')
          old_totp = '''        val totpText = when (p.totpEnabled) { true -> "已启用 TOTP 双重验证"; false -> "未启用 TOTP"; null -> "站点未返回 TOTP 状态" }
        securityPanel.addView(securityRow("双重验证", totpText, if (p.totpEnabled == true) "管理" else "启用") {
            authenticate("管理双重验证") { if (p.totpEnabled == true) beginTotpDisable() else beginTotpSetup() }
        })'''
          new_totp = '''        val totpText = when (p.totpEnabled) { true -> "已启用 TOTP 双重验证"; false -> "未启用 TOTP"; null -> "当前站点暂未提供双重验证功能" }
        val totpAction = when (p.totpEnabled) { true -> "管理"; false -> "启用"; null -> "暂不支持" }
        securityPanel.addView(securityRow("双重验证", totpText, totpAction) {
            if (p.totpEnabled == null) {
                toast("当前站点尚未开发双重验证功能")
            } else {
                authenticate("管理双重验证") { if (p.totpEnabled == true) beginTotpDisable() else beginTotpSetup() }
            }
        })'''
          s = must_replace(s, old_totp, new_totp, 'TOTP capability UI')
          write(name, s)

          # Analysis page + custom chart.
          name = 'AnalysisActivity.kt'
          s = read(name)
          s = s.replace('background = pillBackground(Color.rgb(222, 243, 237))', 'background = pillBackground(LuMingTheme.positivePill(this@AnalysisActivity))')
          s = s.replace('setColor(Color.rgb(222, 230, 233))', 'setColor(LuMingTheme.divider(this@AnalysisActivity))')
          s = s.replace('Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(25, 157, 130) }', 'Paint(Paint.ANTI_ALIAS_FLAG).apply { color = LuMingTheme.accent(context) }')
          s = s.replace('Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(211, 220, 224) }', 'Paint(Paint.ANTI_ALIAS_FLAG).apply { color = LuMingTheme.divider(context) }')
          s = s.replace('color = Color.rgb(112, 125, 137)', 'color = LuMingTheme.textMuted(context)')
          s = s.replace('color = Color.rgb(65, 78, 90)', 'color = LuMingTheme.textSecondary(context)')
          write(name, s)

          # Usage explorer: panels, controls and custom charts.
          name = 'UsageExplorerActivity.kt'
          s = read(name)
          s = s.replace('background = pillBackground(Color.rgb(222, 243, 237))', 'background = pillBackground(LuMingTheme.positivePill(this@UsageExplorerActivity))')
          s = s.replace('private fun miniBackground() = GradientDrawable().apply { setColor(Color.rgb(236, 243, 245)); cornerRadius = dp(16).toFloat() }', 'private fun miniBackground() = GradientDrawable().apply { setColor(LuMingTheme.panelAlt(this@UsageExplorerActivity)); cornerRadius = dp(16).toFloat() }')
          s = s.replace('private fun buttonBackground() = GradientDrawable().apply { setColor(Color.rgb(239, 244, 246)); cornerRadius = dp(16).toFloat(); setStroke(dp(1), Color.rgb(220, 228, 232)) }', 'private fun buttonBackground() = GradientDrawable().apply { setColor(LuMingTheme.panelAlt(this@UsageExplorerActivity)); cornerRadius = dp(16).toFloat(); setStroke(dp(1), LuMingTheme.border(this@UsageExplorerActivity)) }')
          s = s.replace('private fun inputBackground() = GradientDrawable().apply { setColor(Color.rgb(235, 241, 244)); cornerRadius = dp(16).toFloat(); setStroke(dp(1), Color.rgb(218, 227, 231)) }', 'private fun inputBackground() = GradientDrawable().apply { setColor(LuMingTheme.input(this@UsageExplorerActivity)); cornerRadius = dp(16).toFloat(); setStroke(dp(1), LuMingTheme.border(this@UsageExplorerActivity)) }')
          s = s.replace('Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(54, 66, 78); textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD }', 'Paint(Paint.ANTI_ALIAS_FLAG).apply { color = LuMingTheme.textPrimary(context); textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD }')
          s = s.replace('Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(207, 218, 223); strokeWidth = 1.5f }', 'Paint(Paint.ANTI_ALIAS_FLAG).apply { color = LuMingTheme.divider(context); strokeWidth = 1.5f }')
          s = s.replace('Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(112, 125, 137); textSize = 23f }', 'Paint(Paint.ANTI_ALIAS_FLAG).apply { color = LuMingTheme.textMuted(context); textSize = 23f }')
          write(name, s)

          # API management: native dialogs + inputs + cards.
          name = 'ApiKeyManagementActivity.kt'
          s = read(name)
          s = s.replace('background = pillBackground(Color.rgb(222, 243, 237))', 'background = pillBackground(LuMingTheme.positivePill(this@ApiKeyManagementActivity))')
          s = re.sub(r'''private fun buttonBackground\(\) = GradientDrawable\(\)\.apply \{\n\s*setColor\(Color\.rgb\(239, 244, 246\)\)\n\s*cornerRadius = dp\(16\)\.toFloat\(\)\n\s*setStroke\(dp\(1\), Color\.rgb\(221, 229, 233\)\)\n\s*\}''', '''private fun buttonBackground() = GradientDrawable().apply {
        setColor(LuMingTheme.panelAlt(this@ApiKeyManagementActivity))
        cornerRadius = dp(16).toFloat()
        setStroke(dp(1), LuMingTheme.border(this@ApiKeyManagementActivity))
    }''', s)
          s = re.sub(r'''private fun inputBackground\(\) = GradientDrawable\(\)\.apply \{\n\s*setColor\(Color\.rgb\(235, 241, 244\)\)\n\s*cornerRadius = dp\(15\)\.toFloat\(\)\n\s*setStroke\(dp\(1\), Color\.rgb\(218, 227, 231\)\)\n\s*\}''', '''private fun inputBackground() = GradientDrawable().apply {
        setColor(LuMingTheme.input(this@ApiKeyManagementActivity))
        cornerRadius = dp(15).toFloat()
        setStroke(dp(1), LuMingTheme.border(this@ApiKeyManagementActivity))
    }''', s)
          write(name, s)

          # Version bump for direct fixed-signature upgrade.
          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 34', 'versionCode = 35')
          g = g.replace('versionName = "0.17.6.4"', 'versionName = "0.17.6.5"')
          gradle.write_text(g)

          # Sanity: the four legacy pages must no longer define a light-only bg helper.
          for file in classes:
              t = read(file)
              if 'private fun bgColor() = Color.rgb(232, 239, 242)' in t:
                  raise SystemExit(f'light-only bg helper remains: {file}')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "PocketSpace"
          git config user.email "xbu080675@gmail.com"
          git add app
          git commit -m "fix: apply dark mode across native screens and gate unsupported 2FA"
          git push origin HEAD:fix/015-safe-launcher
