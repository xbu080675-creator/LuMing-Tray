name: One-shot native dark theme sweep

on:
  push:
    branches:
      - fix/015-safe-launcher
    paths:
      - .github/workflows/native-theme-sweep.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/015-safe-launcher
          fetch-depth: 0
          persist-credentials: true
      - name: Patch native theme coverage and unsupported TOTP
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/native-theme-sweep.py
          python3 /tmp/native-theme-sweep.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "PocketSpace"
          git config user.email "xbu080675@gmail.com"
          git add app
          git commit -m "fix: apply dark mode across native screens and gate unsupported 2FA"
          git push origin HEAD:fix/015-safe-launcher
